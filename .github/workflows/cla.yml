# The contributor licence agreement, enforced on every pull request.
#
# A first-time contributor is asked to sign by commenting on the pull request; the signature
# is recorded in signatures/cla.json on the branch cla-signatures of this repository, so nothing
# outside the repository holds it and the check runs on the repository's own token. The
# repository owner and bots are allow-listed. Text of the agreement: legal/CLA-individual.md
# (employers: legal/CLA-corporate.md).
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor licence agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/rgeissen/uderia-core/blob/main/legal/CLA-individual.md'
          branch: 'cla-signatures'
          allowlist: 'rgeissen,dependabot[bot],github-actions[bot]'
          create-file-commit-message: 'CLA: create the signature file'
          signed-commit-message: 'CLA: $contributorName signed'
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be reviewed, please sign the contributor licence agreement (legal/CLA-individual.md, or legal/CLA-corporate.md for your employer) by commenting the sentence below. It grants the copyright holder the right to distribute your contribution under any licence, which is what keeps the public core and the enterprise package possible; you keep every right to your own work.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the contributor licence agreement.'
          lock-pullrequest-aftermerge: false
