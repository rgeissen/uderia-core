<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Source of images/how-it-works.png (README). Edit here, then rasterise at 2x: 1920 x 940. -->
  <title>How Uderia works</title>
  <desc>Who asks (the interface, or your code over REST, a scheduler, pipelines and MCP clients) reaches the Uderia engine, where agents of four classes run behind gates, authority and scoring. The engine works with what stays yours (models, data reached through MCP servers under your accounts, and documents, graphs and memory) and writes a signed record of evidence, audit and cost.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

  <!-- Band 1: who asks -->
  <rect x="20" y="20" width="920" height="110" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="70" font-size="12" font-weight="700" letter-spacing="1.5" fill="#57606a">WHO ASKS</text>
  <rect x="190" y="45" width="250" height="60" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="315" y="81" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">The interface</text>
  <rect x="470" y="45" width="450" height="60" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="695" y="70" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Your code</text>
  <text x="695" y="92" text-anchor="middle" font-size="13" fill="#57606a">REST · scheduler · pipelines · MCP clients</text>

  <!-- arrow band 1 -> band 2 -->
  <line x1="555" y1="132" x2="555" y2="166" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="567" y="153" font-size="12" fill="#57606a">the same engine, the same agents</text>

  <!-- Band 2: the engine -->
  <rect x="20" y="170" width="700" height="120" rx="12" fill="#fff4ee" stroke="#F15F22" stroke-width="1.5"/>
  <text x="44" y="222" font-size="12" font-weight="700" letter-spacing="1.5" fill="#c2410c">THE UDERIA</text>
  <text x="44" y="240" font-size="12" font-weight="700" letter-spacing="1.5" fill="#c2410c">ENGINE</text>
  <rect x="190" y="198" width="290" height="64" rx="8" fill="#ffffff" stroke="#F15F22"/>
  <text x="335" y="224" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Agents</text>
  <text x="335" y="246" text-anchor="middle" font-size="13" fill="#57606a">Ideate · Focus · Optimize · Coordinate</text>
  <line x1="482" y1="230" x2="512" y2="230" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="516" y="198" width="186" height="64" rx="8" fill="#ffffff" stroke="#F15F22"/>
  <text x="609" y="224" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Gates</text>
  <text x="609" y="246" text-anchor="middle" font-size="13" fill="#57606a">authority · scoring</text>

  <!-- arrow engine -> signed record -->
  <line x1="722" y1="230" x2="758" y2="230" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Signed record (cylinder) -->
  <path d="M762,196 a89,12 0 0,1 178,0 v68 a89,12 0 0,1 -178,0 z" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <path d="M762,196 a89,12 0 0,0 178,0" fill="none" stroke="#1f2328" stroke-width="1.5"/>
  <text x="851" y="236" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Signed record</text>
  <text x="851" y="257" text-anchor="middle" font-size="13" fill="#57606a">evidence · audit · cost</text>

  <!-- arrow band 2 <-> band 3 -->
  <line x1="335" y1="294" x2="335" y2="326" stroke="#57606a" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="347" y="314" font-size="12" fill="#57606a">used, never taken over</text>

  <!-- Band 3: what stays yours -->
  <rect x="20" y="330" width="920" height="120" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="44" y="382" font-size="12" font-weight="700" letter-spacing="1.5" fill="#57606a">WHAT STAYS</text>
  <text x="44" y="400" font-size="12" font-weight="700" letter-spacing="1.5" fill="#57606a">YOURS</text>
  <rect x="190" y="358" width="220" height="64" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="300" y="384" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Models</text>
  <text x="300" y="406" text-anchor="middle" font-size="13" fill="#57606a">11 providers, hosted or local</text>
  <rect x="426" y="358" width="270" height="64" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="561" y="384" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Data</text>
  <text x="561" y="406" text-anchor="middle" font-size="13" fill="#57606a">through MCP, under your accounts</text>
  <rect x="712" y="358" width="208" height="64" rx="8" fill="#ffffff" stroke="#8c959f"/>
  <text x="816" y="384" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Knowledge</text>
  <text x="816" y="406" text-anchor="middle" font-size="13" fill="#57606a">documents · graphs · memory</text>
</svg>
